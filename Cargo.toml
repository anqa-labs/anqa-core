[workspace]
members = [
    "programs/*"
]
# Its own workspace root — it carries [workspace.metadata.kani], which is the
# proof configuration and the reason this library was chosen. Excluded here so
# `cargo kani` still works inside it; depended on by path from the program.
exclude = ["vendor/percolator"]
resolver = "2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
